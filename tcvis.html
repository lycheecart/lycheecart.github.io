<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Two's Complement Visualizer</title>

<style>
 body {
     width: 66%;
     background: #022;
     color: #fff;
     line-height: 1.4em;
     font-size: 1.2em;
     padding: 2em;
 }

 td {
     border-top: 1px solid grey;
     margin: 0px;
 }

 button {
     padding: 0.5em;
 }

</style>

</head>

<body>

 <h2>Two's Complement Visualizer</h2>

 <span>
  <input id="dec" type="number" value="0" min="-32768" max="32767" />
 </span>

 <hr/>

 <h4>Unsigned</h4>
 
 <span id = "uns">
  <button>0</button>
  <button>0</button>
  <button>0</button>
  <button>0</button>
  <button>0</button>
  <button>0</button>
  <button>0</button>
  <button>0</button>
    &nbsp;&nbsp;&nbsp;&nbsp;
  <button>0</button>
  <button>0</button>
  <button>0</button>
  <button>0</button>
  <button>0</button>
  <button>0</button>
  <button>0</button>
  <button>0</button>
 </span>

 <hr/>

 <h4>One's Complement</h4>

 <span id = "oc">
  <button>0</button>
  <button>0</button>
  <button>0</button>
  <button>0</button>
  <button>0</button>
  <button>0</button>
  <button>0</button>
  <button>0</button>
    &nbsp;&nbsp;&nbsp;&nbsp;
  <button>0</button>
  <button>0</button>
  <button>0</button>
  <button>0</button>
  <button>0</button>
  <button>0</button>
  <button>0</button>
  <button>0</button>
 </span>

 <hr/>

 <h4>Two's Complement</h4>

 <span id = "tc">
  <button>0</button>
  <button>0</button>
  <button>0</button>
  <button>0</button>
  <button>0</button>
  <button>0</button>
  <button>0</button>
  <button>0</button>
    &nbsp;&nbsp;&nbsp;&nbsp;
  <button>0</button>
  <button>0</button>
  <button>0</button>
  <button>0</button>
  <button>0</button>
  <button>0</button>
  <button>0</button>
  <button>0</button>
 </span>

</body>

<script src="./tcvis.js"></script>

</html>
